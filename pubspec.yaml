name: run_aggregator
description: Aggregate and analyze running data from multiple platforms with raw metrics, splits, filters, and weather correlations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # For charts
  fl_chart: ^0.69.0
  # Local DB
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  # File picking / import
  file_picker: ^8.1.2
  # XML/GPX/TCX parsing
  xml: ^6.5.0
  # HTTP for weather
  http: ^1.2.2
  # Date formatting
  intl: ^0.19.0
  # State management (simple)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
