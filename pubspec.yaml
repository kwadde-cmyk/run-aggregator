name: run_aggregator
description: Aggregate and analyze running data from multiple platforms with raw metrics, splits, filters, and weather correlations.
publish_to: 'none'
# Android versionCode is the number after '+'. It must stay greater than 2004
# (ZAPstore already shipped 2001, 2003 and 2004). Never pass --split-per-abi:
# Flutter then publishes arm64 as 2000+this number.
version: 1.0.6+2006

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  http: ^1.2.2
  intl: ^0.20.3
  provider: ^6.1.2
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  xml: ^6.5.0
  flutter_inappwebview: 6.2.0-beta.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
