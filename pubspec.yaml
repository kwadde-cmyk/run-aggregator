name: run_aggregator
description: Aggregate and analyze running data from multiple platforms with raw metrics, splits, filters, and weather correlations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  http: ^1.2.2
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  xml: ^6.5.0
  flutter_inappwebview: 6.2.0-beta.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
