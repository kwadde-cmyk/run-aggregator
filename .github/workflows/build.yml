name: Build signed APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > /tmp/upload-keystore.jks
          ls -la /tmp/upload-keystore.jks

      - name: Verify keystore
        run: |
          keytool -list -keystore /tmp/upload-keystore.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Build release APK (split per ABI)
        run: flutter build apk --release

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
