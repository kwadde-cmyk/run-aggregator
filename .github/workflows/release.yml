name: Build APK and Publish to ZAPstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > /tmp/upload-keystore.jks
          ls -la /tmp/upload-keystore.jks

      - name: Verify keystore
        run: |
          keytool -list -keystore /tmp/upload-keystore.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: build/app/outputs/flutter-apk/*release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install zsp
        run: |
          curl -L https://github.com/zapstore/zsp/releases/download/v0.4.17/zsp-0.4.17-linux-amd64 -o zsp
          chmod +x zsp
          sudo mv zsp /usr/local/bin/

      - name: Setup persistent bunker client key
        env:
          SIGN_WITH: ${{ secrets.SIGN_WITH }}
          ZSP_BUNKER_CLIENT_KEY: ${{ secrets.ZSP_BUNKER_CLIENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ZSP_BUNKER_CLIENT_KEY" ]; then
            echo "ERROR: ZSP_BUNKER_CLIENT_KEY secret is not set"
            exit 1
          fi
          if [ ${#ZSP_BUNKER_CLIENT_KEY} -ne 64 ]; then
            echo "ERROR: ZSP_BUNKER_CLIENT_KEY must be 64 hex chars (openssl rand -hex 32)"
            exit 1
          fi
          # Extract bunker pubkey from SIGN_WITH (bunker://<pubkey>?...)
          BUNKER_PUBKEY=$(echo "$SIGN_WITH" | sed -n 's|^bunker://\([^?]*\).*|\1|p')
          if [ -z "$BUNKER_PUBKEY" ]; then
            echo "ERROR: Could not extract pubkey from SIGN_WITH bunker URL"
            exit 1
          fi
          echo "Using bunker pubkey: $BUNKER_PUBKEY"
          KEY_DIR="$HOME/.config/zsp/bunker-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_FILE="$KEY_DIR/${BUNKER_PUBKEY}.key"
          printf '%s\n' "$ZSP_BUNKER_CLIENT_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "Wrote persistent client key to $KEY_FILE"
          ls -la "$KEY_FILE"

      - name: Publish to ZAPstore
        env:
          SIGN_WITH: ${{ secrets.SIGN_WITH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Starting zsp publish (timeout 5min)..."
          timeout 300 zsp publish --skip-certificate-linking zapstore.yaml || {
            echo "zsp publish failed or timed out"
            exit 1
          }
          echo "zsp publish finished successfully"
