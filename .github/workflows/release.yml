name: Release

# Build a signed universal APK, publish a GitHub Release, then optionally
# hand the tag to the ZAPstore workflow. Dispatch this yourself. Creating a
# release with GITHUB_TOKEN does not start other workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag, e.g. v1.0.5. Must match pubspec.yaml (1.0.5+2005)."
        required: true
        type: string
      publish_zapstore:
        description: "After the GitHub Release, publish that tag to ZAPstore"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > /tmp/upload-keystore.jks
          test -s /tmp/upload-keystore.jks
          ls -la /tmp/upload-keystore.jks

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -keystore /tmp/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Build universal release APK
        # No --split-per-abi. Flutter would set arm64 versionCode to
        # 2000+build, which already published 2001, 2003 and 2004.
        run: flutter build apk --release

      - name: Require versionCode above 2004
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "Universal APK missing at $APK"
            exit 1
          fi
          PUBSPEC=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          VERSION_NAME=${PUBSPEC%%+*}
          BUILD_NUM=${PUBSPEC##*+}
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME is not set; cannot read the APK versionCode"
            exit 1
          fi
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "aapt not found under $SDK/build-tools"
            exit 1
          fi
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | head -n 3
          VC=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          VN=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)
          if [ -z "$VC" ] || [ -z "$VN" ] || [ -z "$PKG" ]; then
            echo "aapt did not report package, versionName and versionCode"
            exit 1
          fi
          echo "pubspec=$PUBSPEC apk_package=$PKG versionName=$VN versionCode=$VC tag=$VERSION_TAG"
          python3 .github/scripts/verify_zapstore_release.py \
            --skip-network \
            --package "$PKG" \
            --version-name "$VN" \
            --version-code "$VC" \
            --tag "$VERSION_TAG" \
            --expected-version-name "$VERSION_NAME" \
            --expected-version-code "$BUILD_NUM"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    if: ${{ inputs.publish_zapstore }}
    permissions:
      contents: read
    uses: ./.github/workflows/zapstore-publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
